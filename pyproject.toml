[project]
name = "seguranca-auditoria"
version = "0.1.0"
description = "Aplicação local de mensagens E2EE com FastAPI, WebSocket e auditoria"
readme = "README.md"
authors = [
    { name = "MCTelles", email = "marcelotelles.033@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "uvicorn[standard]>=0.23.2",
    "cryptography>=41.0.3,<42.0.0",
    "sqlmodel>=0.0.47",
    "sqlalchemy>=2.0.54",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "pyjwt>=2.15.0",
    "pwdlib[argon2]>=0.3.1",
    "slowapi>=0.1.10",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.1",
    "websockets>=17.0",
]

[project.scripts]
seguranca-auditoria = "seguranca_auditoria:main"
init-db = "seguranca_auditoria.database:create_db_and_tables"
cypherchat = "seguranca_auditoria.client:main"
bootstrap-admin = "seguranca_auditoria.bootstrap:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
